[project]
name = "systop"
description = "Sysadmin tarmoq TUI: internet tezligi, ping (lokal/global), tarmoq topologiyasi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Azizbek" }]
keywords = ["network", "sysadmin", "tui", "speedtest", "ping", "traceroute", "topology"]
dynamic = ["version"]

dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "httpx>=0.27",
    "icmplib>=3.0.4",
    "psutil>=6.0",
    "argcomplete>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "textual-dev>=1.5",
    "pre-commit>=3.7",
]

[project.scripts]
systop = "systop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/systop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/systop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# ASYNC109: `timeout` parametrlari icmplib/httpx ga uzatiladi (qo'lda timeout emas).
ignore = ["ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["systop"]
branch = true

[tool.coverage.report]
show_missing = true
