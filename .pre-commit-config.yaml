# Pre-commit hooks — a quality gate on every commit.
# O'rnatish: uv run pre-commit install
# Versiyani yangilash: uv run pre-commit autoupdate
#
# ruff/format — fast, per file. mypy + pytest — local (from the project uv env),
# runs the full check before the commit lands. Real cross-OS coverage
# (Windows/Linux/macOS) happens in the CI matrix (.github/workflows/ci.yml)
# on push.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (statik tip tekshiruvi)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (offline testlar)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]
