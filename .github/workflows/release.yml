name: Release

on:
  push:
    tags:
      - "v*"
  # Tegsiz ham qo'lda ishga tushirish — binarlarni tekshirib ko'rish uchun
  # (release yaratilmaydi, faqat artefaktlar).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Python distributivlari (wheel + sdist) — PyPI uchun.
  #    DIQQAT: wheel/sdist MANBA KODINI OCHIQ tashiydi. Yopiq tarqatish uchun
  #    faqat quyidagi `binaries` job'ining chiqishi ishlatilsin.
  # ---------------------------------------------------------------------------
  sdist-wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # ---------------------------------------------------------------------------
  # 2. Standalone onefile binarlar — HAR BIR OS O'Z OS'IDA.
  #
  #    NEGA MATRITSA MAJBURIY: PyInstaller cross-compile QILMAYDI. U host
  #    OS'ning CPython kutubxonasini (libpython / python3xx.dll) va host uchun
  #    kompilyatsiya qilingan bootloader'ni binarga joylaydi. Shuning uchun
  #    macOS'da o'tirib Windows .exe yasab bo'lmaydi — bu ish oqimi Windows
  #    .exe olishning YAGONA ishonchli yo'li.
  # ---------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 ATAYIN tanlangan (ubuntu-latest emas): PyInstaller
          # binari yig'ilgan glibc'dan PASTROQ tizimda ishlamaydi
          # (`GLIBC_2.xx not found`). Eski runner'da yig'ish = kengroq moslik.
          - os: ubuntu-22.04
            label: linux-x86_64
            asset: systop-linux-x86_64
            exe: dist/systop
          - os: windows-latest
            label: windows-x86_64
            asset: systop-windows-x86_64.exe
            exe: dist/systop.exe
          - os: macos-14 # Apple Silicon
            label: macos-arm64
            asset: systop-macos-arm64
            exe: dist/systop
          - os: macos-13 # Intel
            label: macos-x86_64
            asset: systop-macos-x86_64
            exe: dist/systop

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync project deps
        run: uv sync

      # Spec fayli uchala OS'da bir xil — `--add-data` ajratuvchisi muammosi
      # (POSIX `:` / Windows `;`) spec ichida umuman yo'q.
      - name: Build onefile binary
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean packaging/systop.spec

      # Smoke test binarni HAQIQATAN tekshiradi: --help, --version,
      # `doctor --quick --json` (JSON parse), bundle ichida styles.tcss bormi,
      # va POSIX'da TUI'ni PTY'da ochib ko'radi. `--help` yolg'iz yetarli emas —
      # u textual'ni umuman ushlamaydi.
      - name: Smoke test binary
        run: uv run --with pyinstaller python packaging/smoke_test.py ${{ matrix.exe }}

      - name: Rename + checksum
        shell: bash
        run: |
          mv "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"
          ls -lh "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.label }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. GitHub Release — barcha binarlar bitta joyda.
  # ---------------------------------------------------------------------------
  github-release:
    name: Attach binaries to Release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true

      - name: Collect checksums into one file
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/systop-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # 4. PyPI (Trusted Publishing / OIDC — token saqlanmaydi).
  # ---------------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: sdist-wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/systop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
