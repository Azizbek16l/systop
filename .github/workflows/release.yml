name: Release

on:
  push:
    tags:
      - "v*"
  # Manual run without a tag — to smoke-test the binaries.
  # (No release is created, artifacts only.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # DIQQAT — YOPIQ TARQATISH.
  #
  # Bu ish oqimi ATAYLAB `wheel`/`sdist` yasamaydi va PyPI'ga chop etmaydi.
  # Both carry `src/` VERBATIM and readable — i.e. distributing them hands out
  # the source. Only the output of the `binaries` job below is distributed.
  #
  # Restoring `uv build` + `pypa/gh-action-pypi-publish` later is easy — but it
  # must be a DELIBERATE decision, not something that reappears by accident.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 1. Standalone onefile binarlar — HAR BIR OS O'Z OS'IDA.
  #
  #    NEGA MATRITSA MAJBURIY: PyInstaller cross-compile QILMAYDI. U host
  #    embeds the host OS's CPython library (libpython / python3xx.dll) and a
  #    host-compiled bootloader into the binary. You therefore cannot build a
  #    Windows .exe from macOS — this workflow is the ONLY reliable way to get one.
  # ---------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 is DELIBERATE (not ubuntu-latest): a PyInstaller
          # binary never runs on a glibc OLDER than the one it was built
          # against (`GLIBC_2.xx not found`). Older runner = wider compatibility.
          - os: ubuntu-22.04
            label: linux-x86_64
            asset: systop-linux-x86_64
            exe: dist/systop
          - os: windows-latest
            label: windows-x86_64
            asset: systop-windows-x86_64.exe
            exe: dist/systop.exe
          # Intel Mac (`macos-13`) is DELIBERATELY absent: GitHub retired that
          # chiqargan va job abadiy `queued` da qotib qoladi. `fail-fast: false`
          # tufayli qolgan uchtasi tugaydi, lekin relise job'i HAMMASINI kutadi —
          # i.e. a single dead matrix entry stalls the whole release
          # (that is why one release sat queued for 58 minutes). If an Intel Mac
          # build is needed, run `packaging/build-macos.sh` on an Intel machine.
          - os: macos-14 # Apple Silicon
            label: macos-arm64
            asset: systop-macos-arm64
            exe: dist/systop

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync project deps
        run: uv sync

      # Spec fayli uchala OS'da bir xil — `--add-data` ajratuvchisi muammosi
      # (POSIX `:` / Windows `;`) does not appear inside the spec at all.
      - name: Build onefile binary
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean packaging/systop.spec

      # Smoke test binarni HAQIQATAN tekshiradi: --help, --version,
      # `doctor --quick --json` (JSON parse), bundle ichida styles.tcss bormi,
      # and on POSIX it opens the TUI in a PTY. `--help` alone is not enough —
      # u textual'ni umuman ushlamaydi.
      - name: Smoke test binary
        run: uv run --with pyinstaller python packaging/smoke_test.py ${{ matrix.exe }}

      - name: Rename + checksum
        shell: bash
        run: |
          mv "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"
          ls -lh "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.label }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. GitHub Release — barcha binarlar bitta joyda.
  # ---------------------------------------------------------------------------
  github-release:
    name: Attach binaries to Release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true

      - name: Collect checksums into one file
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/systop-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

